name: Validate learning website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application, calculators and access boundaries
        run: |
          npm ci
          node --check dist/app.js
          node --check dist/platform.js
          node --check dist/admin.js
          node --check server/api.mjs
          node tests/math.test.mjs
          node tests/topic-labs.test.mjs
          node tests/platform.test.mjs
          node tests/content.test.mjs
          node tests/advanced-labs.test.mjs
          node tests/professional-labs.test.mjs
          node tests/source-figures.test.mjs
          node scripts/verify-public.mjs
