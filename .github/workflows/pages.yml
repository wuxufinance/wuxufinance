name: Validate learning website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application, calculators and access boundaries
        run: |
          npm ci
          npm run build
          node --check dist/app.js
          node --check dist/platform.js
          node --check dist/admin.js
          node --check server/api.mjs
          node --check dist/public-tools.js
          npm test
          git diff --exit-code -- dist content/generated-pages.json
